query Event($id: ID!) {
  event(id: $id) {
    event {
      id
      title
      description
      startsAt
      venue {
        id
        name
        imageUrl
      }
      tickets {
        id
        label
        priceCents
        currency
        quantityAvailable
      }
      imageUrl
    }
    error {
      text
    }
  }
}
